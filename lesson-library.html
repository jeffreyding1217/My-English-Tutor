<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson Library — Volunteer World Tutors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1e4e8c; --blue-deep:#133761; --green:#1f8a5f; --green-deep:#146a48;
    --amber:#f2a73b; --ink:#132436; --ink-soft:#4a5c6b; --line:#dfe7e4; --tint:#f5faf8;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Inter',sans-serif; background:#eef3f2; color:var(--ink); }
  .topbar{
    background:var(--blue-deep); color:#fff; padding:14px 22px; display:flex; align-items:center;
    justify-content:space-between; position:sticky; top:0; z-index:10;
  }
  .topbar .brand{ font-family:'Fraunces',serif; font-weight:700; font-size:1.05rem; display:flex; align-items:center; gap:10px; }
  .brand .mark{ width:28px; height:28px; border-radius:7px; background:linear-gradient(135deg,var(--blue),var(--green)); display:flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:700; }
  .topbar .hint{ font-size:0.78rem; color:#bcd0e4; }

  .app{ display:grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 56px); }

  .sidebar{ background:#fff; border-right:1px solid var(--line); padding: 18px 10px; overflow-y:auto; }
  .lesson-btn{
    width:100%; text-align:left; background:none; border:none; padding:11px 12px; border-radius:9px;
    cursor:pointer; font-family:'Inter',sans-serif; font-size:0.86rem; font-weight:600; color:var(--ink-soft);
    display:flex; align-items:center; gap:10px; margin-bottom:3px; transition: background .12s ease, color .12s ease;
  }
  .lesson-btn:hover{ background:var(--tint); color:var(--ink); }
  .lesson-btn.active{ background:var(--blue); color:#fff; }
  .lesson-btn .num{
    width:24px; height:24px; border-radius:50%; background:var(--tint); color:var(--green-deep);
    display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700; flex-shrink:0;
    font-family:'IBM Plex Mono', monospace;
  }
  .lesson-btn.active .num{ background:rgba(255,255,255,0.2); color:#fff; }

  .viewer{ display:flex; flex-direction:column; align-items:center; padding: 26px 20px 20px; }
  .stage-wrap{ width:100%; max-width: 1100px; }
  .stage{
    position:relative; width:100%; aspect-ratio: 16/9; background:#0f2540; border-radius:12px;
    overflow:hidden; box-shadow: 0 16px 40px rgba(19,36,54,0.22);
  }
  .stage img{ width:100%; height:100%; object-fit:contain; display:block; background:#fff; }

  .controls{
    display:flex; align-items:center; justify-content:space-between; margin-top:16px; width:100%; max-width:1100px;
  }
  .nav-btn{
    display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--line); color:var(--ink);
    font-weight:600; font-size:0.9rem; padding:10px 18px; border-radius:999px; cursor:pointer;
    transition: all .15s ease;
  }
  .nav-btn:hover:not(:disabled){ border-color:var(--blue); color:var(--blue); }
  .nav-btn:disabled{ opacity:0.35; cursor:default; }
  .counter{ font-family:'IBM Plex Mono', monospace; font-size:0.85rem; color:var(--ink-soft); }
  .fs-btn{
    background: var(--green); color:#fff; border:none; padding:10px 18px; border-radius:999px;
    font-weight:600; font-size:0.9rem; cursor:pointer;
  }
  .fs-btn:hover{ background:var(--green-deep); }

  .lesson-title{ font-family:'Fraunces',serif; font-weight:700; font-size:1.3rem; color:var(--blue-deep); margin: 0 0 4px; }
  .lesson-sub{ font-size:0.86rem; color:var(--ink-soft); margin-bottom:18px; }

  /* fullscreen mode */
  .stage:fullscreen{ border-radius:0; }
  .stage:fullscreen img{ object-fit:contain; }

  @media (max-width: 820px){
    .app{ grid-template-columns: 1fr; }
    .sidebar{ border-right:none; border-bottom:1px solid var(--line); display:flex; overflow-x:auto; gap:6px; padding:12px; }
    .lesson-btn{ white-space:nowrap; width:auto; margin-bottom:0; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mark">WT</span> Lesson Library</div>
  <div class="hint">Open this page, pick a lesson, then share this browser tab on your video call.</div>
</div>

<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="viewer">
    <div class="stage-wrap">
      <h2 class="lesson-title" id="lessonTitle"></h2>
      <p class="lesson-sub" id="lessonSub"></p>
      <div class="stage" id="stage">
        <img id="slideImg" src="" alt="Slide">
      </div>
      <div class="controls">
        <button class="nav-btn" id="prevBtn">&#8592; Prev</button>
        <span class="counter" id="counter"></span>
        <button class="fs-btn" id="fsBtn">Fullscreen for Sharing</button>
        <button class="nav-btn" id="nextBtn">Next &#8594;</button>
      </div>
    </div>
  </main>
</div>

<script>
  const lessons = [
    { id: 0, label: "Lesson 0", title: "Welcome & Level Check", slides: 7 },
    { id: 1, label: "Lesson 1", title: "Pronunciation Basics", slides: 4 },
    { id: 2, label: "Lesson 2", title: "Functional Survival Phrases", slides: 4 },
    { id: 3, label: "Lesson 3", title: "Subject-Verb Mechanics", slides: 4 },
    { id: 4, label: "Lesson 4", title: "Basic Timeline Shifts", slides: 4 },
    { id: 5, label: "Lesson 5", title: "Determiners and Connectors", slides: 4 },
    { id: 6, label: "Lesson 6", title: "Sentence Rhythm and Intonation", slides: 4 },
    { id: 7, label: "Lesson 7", title: "Conversational Expansion", slides: 4 },
    { id: 8, label: "Lesson 8", title: "Compound Grammar & Conditions", slides: 4 },
    { id: 9, label: "Lesson 9", title: "Contextual Vocabulary & Phrasal Verbs", slides: 4 },
    { id: 10, label: "Lesson 10", title: "Thinking in English", slides: 4 },
  ];

  let currentLesson = 0;
  let currentSlide = 1;

  const sidebar = document.getElementById('sidebar');
  const slideImg = document.getElementById('slideImg');
  const counter = document.getElementById('counter');
  const lessonTitle = document.getElementById('lessonTitle');
  const lessonSub = document.getElementById('lessonSub');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const stage = document.getElementById('stage');

  function renderSidebar(){
    sidebar.innerHTML = '';
    lessons.forEach(l => {
      const btn = document.createElement('button');
      btn.className = 'lesson-btn' + (l.id === currentLesson ? ' active' : '');
      btn.innerHTML = `<span class="num">${l.id}</span> ${l.title}`;
      btn.onclick = () => { currentLesson = l.id; currentSlide = 1; render(); };
      sidebar.appendChild(btn);
    });
  }

  function render(){
    const l = lessons.find(x => x.id === currentLesson);
    slideImg.src = `slides/lesson${l.id}/${String(currentSlide).padStart(2,'0')}.jpg`;
    counter.textContent = `Slide ${currentSlide} of ${l.slides}`;
    lessonTitle.textContent = `${l.label}: ${l.title}`;
    lessonSub.textContent = l.id === 0
      ? 'First-session welcome, teacher introduction, and level check.'
      : 'Fill-in lesson template — title, focus areas, teach & practice, wrap-up.';
    prevBtn.disabled = currentSlide === 1;
    nextBtn.disabled = currentSlide === l.slides;
    renderSidebar();
  }

  prevBtn.onclick = () => { if(currentSlide > 1){ currentSlide--; render(); } };
  nextBtn.onclick = () => {
    const l = lessons.find(x => x.id === currentLesson);
    if(currentSlide < l.slides){ currentSlide++; render(); }
  };

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowRight') nextBtn.click();
    if(e.key === 'ArrowLeft') prevBtn.click();
  });

  document.getElementById('fsBtn').onclick = () => {
    if(stage.requestFullscreen) stage.requestFullscreen();
  };

  render();
</script>

</body>
</html>
