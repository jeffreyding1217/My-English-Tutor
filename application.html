<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer Application — Bridge to China</title>
<script src="supabase.js"></script>
<script>window.supabase || document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>')</script>
<style>
  :root{
    --bg:#ffffff; --bg-tint:#f5faf8; --bg-tint-2:#eef6f2; --blue:#1e4e8c; --blue-deep:#133761;
    --green:#1f8a5f; --green-deep:#146a48; --amber:#f2a73b; --ink:#132436; --ink-soft:#4a5c6b; --line:#dfe7e4;
    --font-display:Georgia,'Songti SC','Noto Serif SC',serif; --font-body:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; --font-mono:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:var(--font-body); color:var(--ink); background:var(--bg-tint); }
  a{ text-decoration:none; color:inherit; }

  .topbar{ background:#fff; border-bottom:1px solid var(--line); padding:14px 28px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; }
  .brand{ display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:1.1rem; color:var(--blue-deep); }
  .brand .mark{ width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,var(--blue),var(--green)); display:flex; align-items:center; justify-content:center; color:#fff; font-size:0.75rem; font-weight:700; }
  .who{ font-size:0.85rem; color:var(--ink-soft); }
  .who a{ color:var(--blue); font-weight:600; }

  .wrap{ max-width:720px; margin:0 auto; padding:34px 24px 80px; }

  .progress{ display:flex; gap:6px; margin-bottom:28px; }
  .progress .seg{ flex:1; height:6px; border-radius:999px; background:var(--line); }
  .progress .seg.done{ background:var(--green); }
  .progress .seg.current{ background:var(--blue); }
  .progress-label{ font-family:var(--font-mono); font-size:0.72rem; color:var(--ink-soft); margin-bottom:10px; letter-spacing:0.05em; }

  .card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:34px; }
  .card h1{ font-family:var(--font-display); font-size:1.5rem; color:var(--blue-deep); margin:0 0 10px; }
  .card .lead{ color:var(--ink-soft); font-size:0.95rem; line-height:1.6; margin-bottom:24px; }

  .step-list{ margin:0 0 22px; padding-left:20px; color:var(--ink-soft); font-size:0.9rem; line-height:2; }

  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:0.85rem; font-weight:700; color:var(--ink); margin-bottom:6px; }
  .field .help{ font-size:0.78rem; color:var(--ink-soft); margin-top:5px; line-height:1.5; }
  .field input[type=text], .field input[type=date], .field input[type=number], .field select, .field textarea{
    width:100%; padding:11px 14px; border-radius:9px; border:1.5px solid var(--line); font-size:0.92rem;
    font-family:var(--font-body); background:var(--bg-tint); color:var(--ink);
  }
  .field textarea{ min-height:110px; resize:vertical; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }

  .radio-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .radio-pill{ padding:9px 16px; border-radius:999px; border:1.5px solid var(--line); font-size:0.85rem; font-weight:600; color:var(--ink-soft); cursor:pointer; background:#fff; }
  .radio-pill.selected{ background:var(--blue); border-color:var(--blue); color:#fff; }

  .scale-row{ display:flex; gap:8px; }
  .scale-dot{ flex:1; text-align:center; padding:10px 4px; border-radius:9px; border:1.5px solid var(--line); font-size:0.78rem; font-weight:700; color:var(--ink-soft); cursor:pointer; background:#fff; }
  .scale-dot.selected{ background:var(--green); border-color:var(--green); color:#fff; }

  .btn{ padding:13px 26px; border-radius:999px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }
  .btn-primary{ background:var(--blue); color:#fff; }
  .btn-primary:hover{ background:var(--blue-deep); }
  .btn-ghost{ background:none; color:var(--ink-soft); border:1.5px solid var(--line); }
  .btn:disabled{ opacity:0.55; cursor:default; }
  .actions{ display:flex; justify-content:space-between; margin-top:28px; }

  .status-msg{ font-size:0.82rem; padding:10px 14px; border-radius:9px; margin-top:16px; display:none; }
  .status-msg.show{ display:block; }
  .status-msg.error{ background:#fdecea; color:#a3312a; }
  .status-msg.success{ background:#e7f5ee; color:var(--green-deep); }

  .checklist{ list-style:none; margin:0; padding:0; }
  .checklist li{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:0.92rem; }
  .checklist li:last-child{ border-bottom:none; }
  .checklist .dot{ width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.7rem; flex-shrink:0; }
  .checklist .dot.done{ background:var(--green); color:#fff; }
  .checklist .dot.todo{ background:var(--bg-tint-2); color:var(--ink-soft); border:1.5px solid var(--line); }
  .checklist .future{ color:var(--ink-soft); }

  .badge-soon{ font-family:var(--font-mono); font-size:0.65rem; background:var(--bg-tint-2); color:var(--ink-soft); padding:3px 8px; border-radius:999px; margin-left:auto; }

  .setup-note{ font-size:0.85rem; color:#9a6b1a; background:#fdf1e0; border-radius:10px; padding:14px 16px; line-height:1.6; }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="brand"><span class="mark">BC</span> Bridge to China</a>
  <div class="who">Logged in as <b id="whoEmail">—</b> &nbsp;·&nbsp; <a href="#" id="logoutLink">Log Out</a></div>
</div>

<div class="wrap" id="appWrap">
  <!-- filled by JS -->
</div>

<script src="auth-config.js"></script>
<script>
  const STEPS = ['welcome','verify','profile','english_bg','chinese_bg','teaching','scenarios','whatsnext','availability'];
  const STATUS_ORDER = ['account_created','email_verified','profile_complete','background_complete','scenarios_complete','assessment_english_complete','assessment_chinese_complete','orientation_complete','submitted'];
  const ADMIN_STATUSES = ['under_review','approved','needs_additional_training','not_approved','suspended'];
  const STEP_LABELS = ['Welcome','Verify Email','Your Profile','English Background','Chinese Background','Teaching Experience','Working With Students','Your Checklist','Availability'];
  let stepIndex = 0;
  let session = null;
  let app = {}; // current applications row (local cache)

  const wrap = document.getElementById('appWrap');

  async function init(){
    if (!isConfigured) {
      wrap.innerHTML = `<div class="card"><div class="setup-note"><b>Not connected yet:</b> this application flow needs your Supabase project connected first. See <code>auth-config.js</code>, then come back here.</div></div>`;
      return;
    }
    const { data: { session: s } } = await supabaseClient.auth.getSession();
    if (!s) { window.location.href = 'login.html'; return; }
    session = s;
    const { data: prof } = await supabaseClient.from('profiles').select('role').eq('id', s.user.id).single();
    if (prof && prof.role === 'student') { window.location.href = 'student-application.html'; return; }
    document.getElementById('whoEmail').textContent = session.user.email;

    let { data: row } = await supabaseClient.from('applications').select('*').eq('id', session.user.id).single();
    if (!row) {
      const { data: created } = await supabaseClient.from('applications')
        .insert({ id: session.user.id, status: 'account_created' })
        .select().single();
      row = created;
    }
    app = row || { status: 'account_created' };

    // Figure out which step to resume at, based on saved status.
    const statusToStep = {
      account_created: 1, email_verified: 2, profile_complete: 3,
      background_complete: 4, scenarios_complete: 7,
    };
    stepIndex = statusToStep[app.status] ?? 7;
    if (session.user.email_confirmed_at && stepIndex === 1) stepIndex = 2;
    if (!session.user.email_confirmed_at && stepIndex > 1) stepIndex = 1; // must verify email before anything else

    render();
  }

  document.getElementById('logoutLink').addEventListener('click', async (e) => {
    e.preventDefault();
    if (isConfigured) await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
  });

  async function saveApplication(fields, nextStatus){
    // Never move status backwards (e.g. re-editing your profile after finishing
    // assessments), and never touch a status an administrator has set.
    const cur = app.status || 'account_created';
    let finalStatus = cur;
    if (!ADMIN_STATUSES.includes(cur)) {
      const curRank = STATUS_ORDER.indexOf(cur), nextRank = STATUS_ORDER.indexOf(nextStatus);
      finalStatus = nextRank > curRank ? nextStatus : cur;
    }
    const payload = { ...fields };
    if (finalStatus !== cur) payload.status = finalStatus;
    const { error } = await supabaseClient.from('applications').update(payload).eq('id', session.user.id);
    if (error) { alert('Could not save: ' + error.message); return false; }
    app = { ...app, ...fields, status: finalStatus };
    return true;
  }

  function progressHTML(){
    const pct = Math.round((stepIndex / (STEPS.length - 1)) * 100);
    return `
      <div class="progress-label">STEP ${stepIndex + 1} OF ${STEPS.length} · ${STEP_LABELS[stepIndex].toUpperCase()}</div>
      <div class="progress">
        ${STEPS.map((_, i) => `<div class="seg ${i < stepIndex ? 'done' : i === stepIndex ? 'current' : ''}"></div>`).join('')}
      </div>`;
  }

  function render(){
    const step = STEPS[stepIndex];
    let body = '';
    if (step === 'welcome') body = welcomeStep();
    else if (step === 'verify') body = verifyStep();
    else if (step === 'profile') body = profileStep();
    else if (step === 'english_bg') body = englishBgStep();
    else if (step === 'chinese_bg') body = chineseBgStep();
    else if (step === 'teaching') body = teachingStep();
    else if (step === 'scenarios') body = scenariosStep();
    else if (step === 'whatsnext') body = whatsNextStep();
    else if (step === 'availability') body = availabilityStep();

    wrap.innerHTML = (step === 'welcome' || step === 'whatsnext') ? body : progressHTML() + body;
    wireStep(step);
  }

  // ---------- Step renderers ----------
  function welcomeStep(){
    return `
      <div class="card">
        <h1>Become a Volunteer</h1>
        <p class="lead">Thank you for your interest in volunteering with Bridge to China. Volunteers help students improve their English while taking part in real cultural exchange.</p>
        <p class="lead" style="margin-bottom:12px;">Creating your account was step one — here's the rest of the process:</p>
        <ol class="step-list">
          <li>Creating your account ✓</li>
          <li>Verifying your email</li>
          <li>Completing your volunteer profile</li>
          <li>Completing English and Chinese language background &amp; assessments</li>
          <li>Completing a volunteer orientation</li>
          <li>Providing your availability</li>
          <li>Receiving approval from our team</li>
        </ol>
        <p class="lead" style="margin-bottom:0;">Creating an account does <b>not</b> automatically make you an approved tutor — our team reviews every application before anyone is matched with a student.</p>
        <div class="actions" style="justify-content:flex-end;">
          <button class="btn btn-primary" onclick="stepIndex=1; render();">Get Started</button>
        </div>
      </div>`;
  }

  function verifyStep(){
    const verified = !!session.user.email_confirmed_at;
    return `
      <div class="card">
        <h1>Check Your Email</h1>
        <p class="lead">Your account has been created! We've sent a verification email to <b>${session.user.email}</b>. Please check your inbox and click the verification link before continuing.</p>
        <div id="verifyMsg" class="status-msg"></div>
        <div class="actions">
          <button class="btn btn-ghost" id="resendBtn">Resend Verification Email</button>
          <button class="btn btn-primary" id="verifiedBtn">I Have Verified My Email</button>
        </div>
      </div>`;
  }

  function profileStep(){
    const v = (k) => app[k] || '';
    return `
      <div class="card">
        <h1>Your Volunteer Profile</h1>
        <p class="lead">We ask for this so students and other volunteers know who you are, and so we can match you with the right time zone and students.</p>
        <div class="two-col">
          <div class="field"><label>First Name</label><input type="text" id="f_first_name" value="${v('first_name')}"></div>
          <div class="field"><label>Last Name</label><input type="text" id="f_last_name" value="${v('last_name')}"></div>
        </div>
        <div class="field"><label>Preferred Name</label><input type="text" id="f_preferred_name" value="${v('preferred_name')}"><div class="help">What should students call you?</div></div>
        <div class="two-col">
          <div class="field"><label>Country</label><input type="text" id="f_country" value="${v('country')}"></div>
          <div class="field"><label>City / Region</label><input type="text" id="f_city_region" value="${v('city_region')}"></div>
        </div>
        <div class="two-col">
          <div class="field"><label>Time Zone</label><input type="text" id="f_timezone" placeholder="e.g. GMT-4" value="${v('timezone')}"><div class="help">Used to match your availability with students.</div></div>
          <div class="field"><label>Date of Birth</label><input type="date" id="f_dob" value="${v('date_of_birth')}"><div class="help">Volunteers must be 18+.</div></div>
        </div>
        <div class="two-col">
          <div class="field"><label>Native Language</label><input type="text" id="f_native_language" value="${v('native_language')}"></div>
          <div class="field"><label>Other Languages</label><input type="text" id="f_other_languages" value="${v('other_languages')}"></div>
        </div>
        <div class="field"><label>Current School / Work Status</label><input type="text" id="f_school_work" value="${v('school_work_status')}"></div>
        <div class="field"><label>Short Biography</label><textarea id="f_bio">${v('bio')}</textarea><div class="help">Shown on your public volunteer profile once approved.</div></div>
        <div id="profileMsg" class="status-msg"></div>
        <div class="actions">
          <button class="btn btn-ghost" onclick="stepIndex=1; render();">Back</button>
          <button class="btn btn-primary" id="profileContinue">Continue</button>
        </div>
      </div>`;
  }

  function comfortScale(id, selected){
    const labels = ['1 — Just starting','2','3 — Getting by','4','5 — Fully fluent'];
    return `<div class="scale-row">${labels.map((l,i) => `<div class="scale-dot ${selected==i+1?'selected':''}" data-scale="${id}" data-val="${i+1}">${i+1}</div>`).join('')}</div>`;
  }

  function yesNo(id, selected){
    return `<div class="radio-row">
      <div class="radio-pill ${selected===true?'selected':''}" data-yn="${id}" data-val="true">Yes</div>
      <div class="radio-pill ${selected===false?'selected':''}" data-yn="${id}" data-val="false">No</div>
    </div>`;
  }

  function englishBgStep(){
    return `
      <div class="card">
        <h1>English Language Background</h1>
        <p class="lead">Your answers here are self-reported — we'll compare them against your assessment results later, so answer honestly rather than optimistically.</p>
        <div class="field"><label>Is English your native language?</label>${yesNo('english_is_native', app.english_is_native)}</div>
        <div class="field"><label>How many years have you used English?</label><input type="text" id="f_english_years" value="${app.english_years||''}"></div>
        <div class="field"><label>Have you studied English formally?</label>${yesNo('english_formal_study', app.english_formal_study)}</div>
        <div class="field"><label>Have you taught English before?</label>${yesNo('english_taught_before', app.english_taught_before)}</div>
        <div class="field"><label>Have you lived in an English-speaking country?</label>${yesNo('english_lived_abroad', app.english_lived_abroad)}</div>
        <div class="field"><label>How comfortable are you speaking English?</label>${comfortScale('english_speaking_comfort', app.english_speaking_comfort)}</div>
        <div class="field"><label>How comfortable are you understanding spoken English?</label>${comfortScale('english_understanding_comfort', app.english_understanding_comfort)}</div>
        <div id="engMsg" class="status-msg"></div>
        <div class="actions">
          <button class="btn btn-ghost" onclick="stepIndex=2; render();">Back</button>
          <button class="btn btn-primary" id="engContinue">Continue</button>
        </div>
      </div>`;
  }

  function chineseBgStep(){
    return `
      <div class="card">
        <h1>Chinese Language Background</h1>
        <p class="lead">This helps us understand how you'll connect with students outside of English practice — not every volunteer needs to speak Chinese well, but we ask everyone the same questions.</p>
        <div class="field"><label>Which Chinese language(s) do you speak?</label><input type="text" id="f_chinese_languages" placeholder="e.g. Mandarin, Cantonese" value="${app.chinese_languages||''}"></div>
        <div class="field"><label>How many years have you studied Chinese?</label><input type="text" id="f_chinese_years" value="${app.chinese_years||''}"></div>
        <div class="field"><label>Where did you learn Chinese?</label><input type="text" id="f_chinese_where" value="${app.chinese_learned_where||''}"></div>
        <div class="field"><label>Have you lived in a Chinese-speaking environment?</label>${yesNo('chinese_lived_immersion', app.chinese_lived_immersion)}</div>
        <div class="field"><label>How comfortable are you speaking Chinese?</label>${comfortScale('chinese_speaking_comfort', app.chinese_speaking_comfort)}</div>
        <div class="field"><label>How comfortable are you understanding spoken Chinese?</label>${comfortScale('chinese_understanding_comfort', app.chinese_understanding_comfort)}</div>
        <div class="field"><label>Can you read Chinese characters?</label>${yesNo('chinese_can_read', app.chinese_can_read)}</div>
        <div class="field"><label>Can you write Chinese characters?</label>${yesNo('chinese_can_write', app.chinese_can_write)}</div>
        <div id="chiMsg" class="status-msg"></div>
        <div class="actions">
          <button class="btn btn-ghost" onclick="stepIndex=3; render();">Back</button>
          <button class="btn btn-primary" id="chiContinue">Continue</button>
        </div>
      </div>`;
  }

  function teachingStep(){
    return `
      <div class="card">
        <h1>Teaching Experience</h1>
        <p class="lead">No experience? That's completely fine — you can still apply. We'll just make sure you get a bit of extra orientation.</p>
        <div class="field"><label>Have you taught before (any subject)?</label>${yesNo('taught_before', app.taught_before)}</div>
        <div class="field"><label>What subjects have you taught?</label><input type="text" id="f_teaching_subjects" value="${app.teaching_subjects||''}"></div>
        <div class="field"><label>Have you taught English before?</label>${yesNo('taught_english_before', app.taught_english_before)}</div>
        <div class="two-col">
          <div class="field"><label>Roughly how many students have you worked with?</label><input type="text" id="f_student_count" value="${app.student_count_taught||''}"></div>
          <div class="field"><label>What age groups have you taught?</label><input type="text" id="f_age_groups" value="${app.age_groups_taught||''}"></div>
        </div>
        <div class="field"><label>Have you taught online before?</label>${yesNo('taught_online_before', app.taught_online_before)}</div>
        <div class="field"><label>Have you worked with students who speak another language?</label>${yesNo('taught_other_language_students', app.taught_other_language_students)}</div>
        <div class="field"><label>Tell us about your teaching experience</label><textarea id="f_teaching_text">${app.teaching_experience_text||''}</textarea></div>
        <div id="teachMsg" class="status-msg"></div>
        <div class="actions">
          <button class="btn btn-ghost" onclick="stepIndex=4; render();">Back</button>
          <button class="btn btn-primary" id="teachContinue">Continue</button>
        </div>
      </div>`;
  }

  function scenariosStep(){
    const q = (id,label,val) => `<div class="field"><label>${label}</label><textarea id="${id}">${val||''}</textarea></div>`;
    return `
      <div class="card">
        <h1>Working With Students</h1>
        <p class="lead">There's no single right answer — we're looking for patience, respect, and good judgment.</p>
        ${q('f_scenario_1','A student is struggling to understand something you explained. What would you do?', app.scenario_1)}
        ${q('f_scenario_2','A student is very quiet and doesn\'t want to participate. How would you respond?', app.scenario_2)}
        ${q('f_scenario_3','You realize a student has misunderstood something you said. What would you do?', app.scenario_3)}
        ${q('f_scenario_4','A student asks you a question and you don\'t know the answer. What should you do?', app.scenario_4)}
        <div id="scenMsg" class="status-msg"></div>
        <div class="actions">
          <button class="btn btn-ghost" onclick="stepIndex=5; render();">Back</button>
          <button class="btn btn-primary" id="scenContinue">Save &amp; Continue</button>
        </div>
      </div>`;
  }

  function whatsNextStep(){
    const locked = ADMIN_STATUSES.includes(app.status) || app.status === 'submitted';
    if (locked) {
      const msgs = {
        submitted: ['Application Submitted', 'Thank you for completing your volunteer application. Our team will review your application, language assessments, and orientation results. You will receive an email when your application status changes. You will not be matched with students until an administrator approves your application.'],
        under_review: ['Under Review', 'Our team is currently reviewing your application. We will email you when your status changes.'],
        approved: ['You\'re Approved!', 'Your application has been approved. You can now be matched with students.'],
        needs_additional_training: ['Additional Training Needed', 'Thank you for applying. Our team would like you to complete some additional training before you are approved. We will email you with the next steps.'],
        not_approved: ['Application Not Approved', 'Thank you for your interest in volunteering. After review, we are not able to approve your application at this time.'],
        suspended: ['Account Suspended', 'Your volunteer account is currently suspended. Please contact our team.'],
      };
      const [t, m] = msgs[app.status];
      return `<div class="card"><h1>${t}</h1><p class="lead">${m}</p><div class="actions" style="justify-content:flex-end;"><a class="btn btn-primary" href="volunteer-dashboard.html">Go to Dashboard</a></div></div>`;
    }

    const engDone = app.english_mc_score != null;
    const chiDone = app.chinese_mc_score != null;
    const oriDone = app.orientation_quiz_score != null && app.orientation_quiz_score >= 80;
    const avDone = !!app.avail_days;
    const allDone = engDone && chiDone && oriDone && avDone;

    const row = (done, label, action, isLocked, note) => `
      <li><span class="dot ${done ? 'done' : 'todo'}">${done ? '✓' : '○'}</span>
        <span class="${done || !isLocked ? '' : 'future'}">${label}</span>
        ${done ? '<span class="badge-soon" style="background:#e7f5ee;color:#146a48;">DONE</span>'
               : isLocked ? `<span class="badge-soon">${note}</span>` : action}
      </li>`;
    const go = (href, text) => `<a class="btn btn-primary" style="margin-left:auto;padding:7px 16px;font-size:.8rem;" href="${href}">${text}</a>`;

    return `
      <div class="card">
        <h1>Your Application Checklist</h1>
        <p class="lead">Complete each remaining step in order. Nothing here makes you an approved volunteer yet — our team reviews every application before anyone is matched with a student.</p>
        <ul class="checklist">
          <li><span class="dot done">✓</span> Create account</li>
          <li><span class="dot done">✓</span> Verify email</li>
          <li><span class="dot done">✓</span> Complete personal information</li>
          <li><span class="dot done">✓</span> Complete English &amp; Chinese background</li>
          <li><span class="dot done">✓</span> Complete teaching experience</li>
          <li><span class="dot done">✓</span> Complete student-scenario questions</li>
          ${row(engDone, 'Complete English assessment', go('assessment.html?lang=english','Start'), false)}
          ${row(chiDone, 'Complete Chinese assessment', go('assessment.html?lang=chinese','Start'), !engDone, 'AFTER ENGLISH')}
          ${row(oriDone, 'Complete volunteer orientation', go('orientation.html','Start'), !chiDone, 'AFTER ASSESSMENTS')}
          ${row(avDone, 'Provide your availability', `<button class="btn btn-primary" style="margin-left:auto;padding:7px 16px;font-size:.8rem;" onclick="stepIndex=8; render();">Start</button>`, !oriDone, 'AFTER ORIENTATION')}
          <li><span class="dot todo">○</span> <span class="future">Application review</span><span class="badge-soon">BY OUR TEAM</span></li>
          <li><span class="dot todo">○</span> <span class="future">Volunteer approval</span><span class="badge-soon">BY OUR TEAM</span></li>
        </ul>
        <div id="submitMsg" class="status-msg"></div>
        <div class="actions">
          <a class="btn btn-ghost" href="volunteer-dashboard.html">Back to Dashboard</a>
          <button class="btn btn-primary" id="submitAppBtn" ${allDone ? '' : 'disabled'}>Submit Application</button>
        </div>
      </div>`;
  }

  function multiPills(group, options, selectedCsv){
    const sel = (selectedCsv || '').split(',').map(x=>x.trim());
    return `<div class="radio-row">${options.map(o=>`<div class="radio-pill multi ${sel.includes(o)?'selected':''}" data-multi="${group}" data-val="${o}">${o}</div>`).join('')}</div>`;
  }

  function availabilityStep(){
    const v = (k) => app[k] ?? '';
    return `
      <div class="card">
        <h1>Your Availability</h1>
        <p class="lead">We use this to match you with students in compatible time zones. You can adjust it later.</p>
        <div class="field"><label>Days you're available</label>${multiPills('days',['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], v('avail_days'))}</div>
        <div class="two-col">
          <div class="field"><label>Earliest start time</label><input type="time" id="f_start" value="${v('avail_start_time')}"><div class="help">In your own time zone (${v('timezone') || 'set in your profile'}).</div></div>
          <div class="field"><label>Latest end time</label><input type="time" id="f_end" value="${v('avail_end_time')}"></div>
        </div>
        <div class="two-col">
          <div class="field"><label>Preferred lesson length</label>
            <select id="f_len"><option ${v('preferred_lesson_length')==='30 minutes'?'selected':''}>30 minutes</option><option ${v('preferred_lesson_length')==='45 minutes'?'selected':''}>45 minutes</option><option ${v('preferred_lesson_length')==='60 minutes'?'selected':''}>60 minutes</option></select>
            <div class="help">Our standard lesson template is 30 minutes.</div></div>
          <div class="field"><label>How many students can you teach?</label><input type="number" min="1" max="20" id="f_maxstu" value="${v('max_students')}"></div>
        </div>
        <div class="field"><label>Maximum volunteer hours per week</label><input type="number" min="1" max="40" id="f_maxhrs" value="${v('max_weekly_hours')}"></div>
        <div class="field"><label>Preferred student age groups</label>${multiPills('ages',['Children','Teens','University / adults','No preference'], v('preferred_age_groups'))}</div>
        <div class="field"><label>Preferred student English levels</label>${multiPills('levels',['Beginner','Intermediate','Advanced','No preference'], v('preferred_student_levels'))}</div>
        <div id="availMsg" class="status-msg"></div>
        <div class="actions">
          <button class="btn btn-ghost" onclick="stepIndex=7; render();">Back to Checklist</button>
          <button class="btn btn-primary" id="availSave">Save Availability</button>
        </div>
      </div>`;
  }

  // ---------- Step wiring (selection UI + save handlers) ----------
  function wireStep(step){
    wrap.querySelectorAll('.radio-pill[data-yn]').forEach(el => {
      el.addEventListener('click', () => {
        const group = el.dataset.yn;
        wrap.querySelectorAll(`.radio-pill[data-yn="${group}"]`).forEach(p => p.classList.remove('selected'));
        el.classList.add('selected');
        el.dataset.chosen = el.dataset.val;
      });
    });
    wrap.querySelectorAll('.scale-dot[data-scale]').forEach(el => {
      el.addEventListener('click', () => {
        const group = el.dataset.scale;
        wrap.querySelectorAll(`.scale-dot[data-scale="${group}"]`).forEach(p => p.classList.remove('selected'));
        el.classList.add('selected');
      });
    });

    wrap.querySelectorAll('.radio-pill.multi').forEach(el => {
      el.addEventListener('click', () => el.classList.toggle('selected'));
    });
    function multi(group){
      return [...wrap.querySelectorAll(`.radio-pill.multi[data-multi="${group}"].selected`)].map(e=>e.dataset.val).join(', ');
    }

    if (step === 'whatsnext') {
      const sb = document.getElementById('submitAppBtn');
      if (sb) sb.onclick = async () => {
        if (!confirm('Submit your application? You won\'t be able to edit it after submitting.')) return;
        const { error } = await supabaseClient.from('applications').update({ status: 'submitted' }).eq('id', session.user.id);
        if (error) { const m = document.getElementById('submitMsg'); m.className='status-msg show error'; m.textContent = error.message; return; }
        app.status = 'submitted'; render();
      };
    }

    if (step === 'availability') {
      document.getElementById('availSave').onclick = async () => {
        const m = document.getElementById('availMsg');
        const days = multi('days');
        if (!days) { m.className='status-msg show error'; m.textContent='Please choose at least one day.'; return; }
        if (!val('f_start') || !val('f_end')) { m.className='status-msg show error'; m.textContent='Please enter a start and end time.'; return; }
        const fields = {
          avail_days: days, avail_start_time: val('f_start'), avail_end_time: val('f_end'),
          preferred_lesson_length: val('f_len'), max_students: parseInt(val('f_maxstu')) || null,
          max_weekly_hours: parseInt(val('f_maxhrs')) || null,
          preferred_age_groups: multi('ages'), preferred_student_levels: multi('levels'),
        };
        if (await saveApplication(fields, app.status)) { stepIndex = 7; render(); }
      };
    }

    function yn(id){
      const chosen = wrap.querySelector(`.radio-pill[data-yn="${id}"].selected`);
      return chosen ? chosen.dataset.val === 'true' : null;
    }
    function scale(id){
      const chosen = wrap.querySelector(`.scale-dot[data-scale="${id}"].selected`);
      return chosen ? parseInt(chosen.dataset.val) : null;
    }

    if (step === 'verify') {
      document.getElementById('resendBtn').onclick = async () => {
        const { error } = await supabaseClient.auth.resend({ type: 'signup', email: session.user.email });
        const el = document.getElementById('verifyMsg');
        el.className = 'status-msg show ' + (error ? 'error' : 'success');
        el.textContent = error ? error.message : 'Verification email sent again — check your inbox.';
      };
      document.getElementById('verifiedBtn').onclick = async () => {
        const { data: { session: refreshed } } = await supabaseClient.auth.refreshSession();
        session = refreshed || session;
        const el = document.getElementById('verifyMsg');
        if (session.user.email_confirmed_at) {
          await saveApplication({}, 'email_verified');
          stepIndex = 2; render();
        } else {
          el.className = 'status-msg show error';
          el.textContent = "We don't see a confirmation yet — click the link in your email, then try again.";
        }
      };
    }

    if (step === 'profile') {
      document.getElementById('profileContinue').onclick = async () => {
        const fields = {
          first_name: val('f_first_name'), last_name: val('f_last_name'), preferred_name: val('f_preferred_name'),
          country: val('f_country'), city_region: val('f_city_region'), timezone: val('f_timezone'),
          date_of_birth: val('f_dob') || null, native_language: val('f_native_language'),
          other_languages: val('f_other_languages'), school_work_status: val('f_school_work'), bio: val('f_bio'),
        };
        if (await saveApplication(fields, 'profile_complete')) { stepIndex = 3; render(); }
      };
    }

    if (step === 'english_bg') {
      document.getElementById('engContinue').onclick = async () => {
        const fields = {
          english_is_native: yn('english_is_native'), english_years: val('f_english_years'),
          english_formal_study: yn('english_formal_study'), english_taught_before: yn('english_taught_before'),
          english_lived_abroad: yn('english_lived_abroad'),
          english_speaking_comfort: scale('english_speaking_comfort'),
          english_understanding_comfort: scale('english_understanding_comfort'),
        };
        if (await saveApplication(fields, 'profile_complete')) { stepIndex = 4; render(); }
      };
    }

    if (step === 'chinese_bg') {
      document.getElementById('chiContinue').onclick = async () => {
        const fields = {
          chinese_languages: val('f_chinese_languages'), chinese_years: val('f_chinese_years'),
          chinese_learned_where: val('f_chinese_where'), chinese_lived_immersion: yn('chinese_lived_immersion'),
          chinese_speaking_comfort: scale('chinese_speaking_comfort'),
          chinese_understanding_comfort: scale('chinese_understanding_comfort'),
          chinese_can_read: yn('chinese_can_read'), chinese_can_write: yn('chinese_can_write'),
        };
        if (await saveApplication(fields, 'background_complete')) { stepIndex = 5; render(); }
      };
    }

    if (step === 'teaching') {
      document.getElementById('teachContinue').onclick = async () => {
        const fields = {
          taught_before: yn('taught_before'), teaching_subjects: val('f_teaching_subjects'),
          taught_english_before: yn('taught_english_before'), student_count_taught: val('f_student_count'),
          age_groups_taught: val('f_age_groups'), taught_online_before: yn('taught_online_before'),
          taught_other_language_students: yn('taught_other_language_students'),
          teaching_experience_text: val('f_teaching_text'),
        };
        if (await saveApplication(fields, 'background_complete')) { stepIndex = 6; render(); }
      };
    }

    if (step === 'scenarios') {
      document.getElementById('scenContinue').onclick = async () => {
        const fields = {
          scenario_1: val('f_scenario_1'), scenario_2: val('f_scenario_2'),
          scenario_3: val('f_scenario_3'), scenario_4: val('f_scenario_4'),
        };
        if (await saveApplication(fields, 'scenarios_complete')) { stepIndex = 7; render(); }
      };
    }
  }

  function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }

  init();
</script>

</body>
</html>
